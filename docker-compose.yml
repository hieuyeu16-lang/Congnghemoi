services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - 4000:4000
    environment:
      DATABASE_URL: postgres://appuser:secret@db:5432/appdb
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Use localhost so the browser on the host can reach the backend at port 4000.
        # host.docker.internal may not be routable in some environments, so prefer localhost.
        VITE_API_URL: http://localhost:4000
    ports:
      - 3000:80
    depends_on:
      - backend

volumes:
  db_data:
